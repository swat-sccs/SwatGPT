services:
  swatgpt-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swatgpt}
      POSTGRES_USER: ${POSTGRES_USER:-swatgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - swatgpt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swatgpt} -d ${POSTGRES_DB:-swatgpt}"]
      interval: 5s
      timeout: 5s
      retries: 20

  swatgpt-mcp:
    build: .
    restart: unless-stopped
    depends_on:
      swatgpt-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      HOST: 0.0.0.0
      PORT: 3000
      MCP_ALLOWED_HOSTS: swatgpt-mcp,localhost,127.0.0.1
      MCP_TOOL_TIMEOUT_MS: ${MCP_TOOL_TIMEOUT_MS:-5000}
      HEALTHCHECK_PROBE_TIMEOUT_MS: ${HEALTHCHECK_PROBE_TIMEOUT_MS:-4000}
      HEALTHCHECK_FAILURE_THRESHOLD: ${HEALTHCHECK_FAILURE_THRESHOLD:-3}
      DASH_BASE_URL: ${DASH_BASE_URL:-https://dash.swarthmore.edu}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      UPSTREAM_RETRIES: ${UPSTREAM_RETRIES:-2}
      UPSTREAM_CONCURRENCY: ${UPSTREAM_CONCURRENCY:-6}
      POLLING_ENABLED: ${POLLING_ENABLED:-true}
      ALERT_POLL_INTERVAL_SECONDS: ${ALERT_POLL_INTERVAL_SECONDS:-60}
      REALTIME_POLL_INTERVAL_SECONDS: ${REALTIME_POLL_INTERVAL_SECONDS:-300}
      CONTENT_POLL_INTERVAL_SECONDS: ${CONTENT_POLL_INTERVAL_SECONDS:-900}
      CONFIG_POLL_INTERVAL_SECONDS: ${CONFIG_POLL_INTERVAL_SECONDS:-3600}
      OBSERVATION_RETENTION_DAYS: ${OBSERVATION_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"

volumes:
  swatgpt-postgres-data:
