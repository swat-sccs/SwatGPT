# systemd drop-in for the self-hosted GitHub Actions runner on eagle
# (actions.runner.swat-sccs-SwatGPT.eagle.service). Install per ops/eagle/README.md.
#
# The runner is installed in /srv/actions-runner and runs as dcrepublic, an SSSD
# (LDAP) account. Starting it before the network and SSSD are up makes the user
# lookup fail at boot and the unit stays dead, so deploys silently stop until
# someone restarts it by hand.
[Unit]
Wants=network-online.target
After=network-online.target nss-user-lookup.target sssd.service

[Service]
Restart=on-failure
RestartSec=30
