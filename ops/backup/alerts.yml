# Reference copy of the swatgpt-backup rule group. The live copy is in
# monitoring/prometheus/swatgpt-alerts.yml, which gull-install.sh installs on gull; edit that one.
# monitoring/tests/hardening.test.mjs fails if this file and that group drift apart.
# The metrics come from node_exporter on eagle (job "eagle", instance eagle...:9100) reading
# /var/lib/node_exporter/textfile_collector/swatgpt_backup{,_verify}.prom, written by
# ops/backup/backup.sh and ops/backup/verify.sh.
groups:
  - name: swatgpt-backup
    rules:
      - alert: SwatGPTBackupStale
        expr: time() - max(swatgpt_backup_last_success_timestamp{job="eagle"}) > 36 * 3600
        for: 15m
        labels:
          severity: critical
          service: swatgpt
        annotations:
          summary: "No successful SwatGPT backup in over 36 hours"
          description: "The newest complete backup on eagle finished {{ $value | humanizeDuration }} ago (decades means none exists). Check `systemctl status swatgpt-backup.service` and `journalctl -u swatgpt-backup.service` on eagle."
          runbook_url: "https://github.com/swat-sccs/SwatGPT/blob/main/monitoring/README.md#swatgptbackupstale"

      - alert: SwatGPTBackupMetricsMissing
        expr: absent(swatgpt_backup_last_success_timestamp{job="eagle"}) and on() max(up{job="eagle", instance=~".*:9100"}) == 1
        for: 2h
        labels:
          severity: warning
          service: swatgpt
        annotations:
          summary: "eagle's node_exporter is up but exports no backup metrics"
          description: "Either the backup timer has never run, the textfile collector flag is missing from node-exporter, or /var/lib/node_exporter/textfile_collector is not readable by it."
          runbook_url: "https://github.com/swat-sccs/SwatGPT/blob/main/monitoring/README.md#swatgptbackupmetricsmissing"

      - alert: SwatGPTBackupRunFailed
        expr: max(swatgpt_backup_last_run_success{job="eagle"}) == 0
        for: 5m
        labels:
          severity: warning
          service: swatgpt
        annotations:
          summary: "The last SwatGPT backup run failed"
          description: "Older backups are intact, but tonight's did not complete. See `journalctl -u swatgpt-backup.service` on eagle. Goes critical as SwatGPTBackupStale after 36h."
          runbook_url: "https://github.com/swat-sccs/SwatGPT/blob/main/monitoring/README.md#swatgptbackuprunfailed"

      - alert: SwatGPTBackupRestoreTestStale
        expr: time() - max(swatgpt_backup_last_verify_success_timestamp{job="eagle"}) > 8 * 86400
        for: 1h
        labels:
          severity: warning
          service: swatgpt
        annotations:
          summary: "No passing SwatGPT backup restore test in 8 days"
          description: "verify.sh last passed {{ $value | humanizeDuration }} ago. Backups that have not been restored are not known to be good. See `journalctl -u swatgpt-backup-verify.service` on eagle."
          runbook_url: "https://github.com/swat-sccs/SwatGPT/blob/main/monitoring/README.md#swatgptbackuprestoreteststale"

      - alert: SwatGPTBackupRestoreTestMissing
        expr: absent(swatgpt_backup_last_verify_success_timestamp{job="eagle"}) and on() max(swatgpt_backup_retained_count{job="eagle"}) >= 8
        for: 1h
        labels:
          severity: warning
          service: swatgpt
        annotations:
          summary: "The SwatGPT backup restore test has never run"
          description: "At least 8 daily backups exist on eagle but verify.sh has never written its metrics. Check that swatgpt-backup-verify.timer is enabled (`systemctl list-timers swatgpt-backup-verify.timer`)."
          runbook_url: "https://github.com/swat-sccs/SwatGPT/blob/main/monitoring/README.md#swatgptbackuprestoretestmissing"
