# Throwaway stand-in for the eagle stack, used only by ops/backup/test/run.sh. Service names
# match docker-compose.yml / docker-compose.override.yml so backup.sh runs unchanged against it.
services:
  mongodb:
    image: ${TEST_MONGO_IMAGE:-mongo:8.0.20}
    command: mongod --noauth
    tmpfs:
      - /data/db

  swatgpt-postgres:
    image: ${TEST_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: swatgpt
      POSTGRES_USER: swatgpt
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data

  qdrant:
    image: ${TEST_QDRANT_IMAGE:-qdrant/qdrant:v1.15.1}
    environment:
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/storage/snapshots
    ports:
      - '127.0.0.1::6333'

  api:
    image: ${TEST_FILES_IMAGE:-alpine:latest}
    command: ['sleep', 'infinity']
    init: true
    volumes:
      - uploads:/app/uploads
      - images:/app/client/public/images
      - librechat-data:/app/data

volumes:
  uploads:
  images:
  librechat-data:
