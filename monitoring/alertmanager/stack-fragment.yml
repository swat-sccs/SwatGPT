# Swarm stack fragment for gull's `prometheus` stack (dcrepublic). Merge the
# `alertmanager` service and the `alertmanager_data` volume into the stack file
# that defines `prometheus_prometheus`, then `docker stack deploy -c <file> prometheus`.
services:
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://alertmanager.sccs.swarthmore.edu"
    volumes:
      - /srv/monitor/alertmanager/config:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitor
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == gull
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure

volumes:
  alertmanager_data:

networks:
  monitor:
    external: true
