# Alertmanager configuration for the gull `prometheus` stack.
# Place at /srv/monitor/alertmanager/config/alertmanager.yml (see monitoring/README.md).
# Fill in ONE delivery channel below and delete the others.
global:
  resolve_timeout: 5m

route:
  receiver: sccs-discord
  # kind/domain are only set by the Dash MCP rules; grouping on them keeps one
  # notification per failing poll kind or stale domain instead of one mixed group.
  group_by: ["alertname", "service", "kind", "domain"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: sccs-discord
      repeat_interval: 1h

inhibit_rules:
  # A dead vLLM already explains slow TTFT, queueing, and app 5xx.
  - source_matchers: ["alertname = SwatGPTVllmDown"]
    target_matchers: ["alertname =~ SwatGPTVllm(Queueing|TtftHigh|KvCacheHigh)|SwatGPTApp5xxRateHigh"]
    equal: ["service"]
  # Dead TEI already explains the retrieval ratio.
  - source_matchers: ["alertname = SwatGPTTeiDown"]
    target_matchers: ["alertname = SwatGPTRetrievalFailureRatioHigh"]
    equal: ["service"]
  # After 36h without a backup the critical Stale alert already covers the failing runs.
  - source_matchers: ["alertname = SwatGPTBackupStale"]
    target_matchers: ["alertname = SwatGPTBackupRunFailed"]
    equal: ["service"]

receivers:
  - name: sccs-discord
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/REPLACE_ME"
        # The title comes from the group labels, which every alert in the group shares.
        # CommonAnnotations.summary is empty whenever the grouped summaries differ (the
        # templated Dash MCP ones do), which left notifications without a title.
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}'
        message: >-
          {{ range .Alerts }}[{{ .Status | toUpper }}] {{ .Labels.alertname }} ({{ .Labels.severity }}):
          {{ .Annotations.summary }}. {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}

